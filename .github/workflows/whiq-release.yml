name: whiq-release

# The P6 clone's MCP server as the White Hat IQ platform runs it: one Node bundle (dist-cli/p6clone-mcp.cjs, node18 target, no
# dependencies) plus the schedule reasoner's models/ and ort/ (WebAssembly runtime, licences), built by scripts/build-cli.mjs,
# tested on Node 24.14.0, and the archive itself extracted and smoked (scripts/release-smoke.mjs: every analysis tool, the
# reasoner loaded) on Windows with Node 24.14.0 (the pilot install) and on Node 20 (the hosted box), and published with SHA256SUMS and an engines.lock the platform's
# scripts/engines-pin.mjs reads. Copy this file to .github/workflows/whiq-release.yml in AshrafMMahdy/p6-clone, then:
#
#   git tag whiq-v0.1.0 && git push origin whiq-v0.1.0     (or Actions › whiq-release › Run workflow, tag whiq-v0.1.0)
#
on:
  push:
    tags: ["whiq-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. whiq-v0.1.0 (empty: build and test only)"
        type: string
        default: ""

permissions:
  contents: write

env:
  APP: p6clone
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  # What is built: a tag that already exists is built from the tag itself (a re-run never builds a later commit under an old
  # tag); a new tag from the commit the run was dispatched on, and the release then creates the tag there.
  plan:
    runs-on: ubuntu-22.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      name: ${{ steps.ref.outputs.name }}
    steps:
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ] && [ -n "${{ inputs.tag }}" ] && gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"; echo "building the existing tag $tag"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; echo "building $GITHUB_SHA"
          fi
          case "$tag" in whiq-v*) echo "name=$APP-$tag" >> "$GITHUB_OUTPUT" ;; *) echo "name=$APP-dev" >> "$GITHUB_OUTPUT" ;; esac

  # The archive is made once, here; the smoke tests that very archive, extracted, and the release publishes it.
  build:
    needs: plan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.plan.outputs.ref }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "24.14.0" }
      - run: npm ci
      - run: npm test
      - run: node scripts/build-cli.mjs
      - name: Archive (bundles, fonts, the reasoner's models/ and ort/ with its licences)
        shell: bash
        run: |
          name="${{ needs.plan.outputs.name }}"
          mkdir -p "dist/$name"
          cp dist-cli/p6clone-mcp.cjs dist-cli/p6clone.cjs README.md "dist/$name/"
          cp -r dist-cli/fonts dist-cli/models dist-cli/ort "dist/$name/"   # the PDF font; optimize_schedule's model and runtime (not node_modules: the platform manifest skips it)
          printf '%s\n' "$APP ${name#$APP-}, commit $(git rev-parse HEAD), bundle node18 target, reasoner runtime onnxruntime-web 1.30.0 (ort/)" > "dist/$name/BUILD.txt"
          # Reproducible: the same commit gives the same archive bytes (names sorted, times of the commit, no owners, no gzip stamp).
          epoch="$(git log -1 --format=%ct)"
          cd dist && tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner -cf - "$name" | gzip -n > "$name.tar.gz"
          ls -la "$name.tar.gz"
      - uses: actions/upload-artifact@v4
        with: { name: archive, path: "dist/*.tar.gz", if-no-files-found: error }

  smoke:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, node: "24.14.0" }   # the pilot install's Node
          - { os: ubuntu-22.04, node: "20" }        # the hosted box
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.plan.outputs.ref }}", sparse-checkout: scripts/release-smoke.mjs, sparse-checkout-cone-mode: false, path: repo }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - uses: actions/download-artifact@v4
        with: { name: archive, path: archive }
      - name: Extract the release archive and smoke every analysis tool (optimize_schedule included) on it
        shell: bash
        run: |
          name="${{ needs.plan.outputs.name }}"
          mkdir extracted && tar -xzf "archive/$name.tar.gz" -C extracted
          node repo/scripts/release-smoke.mjs "extracted/$name"

  release:
    needs: [plan, smoke]
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.plan.outputs.ref }}" }
      - uses: actions/download-artifact@v4
        with: { name: archive, path: dist }
      - name: SHA256SUMS and engines.lock
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          cd dist
          sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
          python3 - "$APP" "$tag" > engines.lock <<'PY'
          import json, sys
          app, tag = sys.argv[1], sys.argv[2]
          rows = [line.split() for line in open("SHA256SUMS")]
          print(json.dumps([{"app": app, "tag": tag, "file": f, "sha256": h} for h, f in rows], indent=2))
          PY
          cat engines.lock
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          cd dist
          # A published asset is never replaced: the platform pins it by sha256 (engines.lock), and a replaced file would fail
          # every install's verify. A release made first on GitHub's Releases page, with no files yet, gets them added.
          if gh release view "$tag" >/dev/null 2>&1; then
            n="$(gh release view "$tag" --json assets --jq '.assets | length')"
            if [ "$n" != "0" ]; then echo "::error::release $tag already has $n file(s); a published release is never overwritten — publish a new tag"; exit 1; fi
            gh release upload "$tag" ./*.tar.gz SHA256SUMS engines.lock
          else
            gh release create "$tag" ./*.tar.gz SHA256SUMS engines.lock --target "$(git rev-parse HEAD)" --title "p6clone $tag" --notes "The P6 clone's MCP server (one Node bundle, node18+, with the schedule reasoner's models/ and ort/ beside it) for the White Hat IQ platform. Checksums: SHA256SUMS; engines.lock for the platform's scripts/engines-pin.mjs."
          fi
